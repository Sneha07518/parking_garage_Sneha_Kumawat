spring.application.name=parksmart
server.port=8080
spring.datasource.url=jdbc:sqlite:./parksmart.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.properties.hibernate.connection.autocommit=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
parksmart.jwt.secret=ParkSmart-development-secret-key-must-be-at-least-256-bits-long-2026
parksmart.jwt.expiration-ms=86400000

