<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | ParkSmart</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="auth"><a class="brand" href="/">Park<span>Smart</span></a><section class="auth-box"><p class="eyebrow">NEW ATTENDANT</p><h1>Make the desk yours.</h1><form id="registerForm"><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><button class="button" type="submit">Create account</button><p class="form-error" id="error"></p></form><p class="muted">Already registered? <a href="/login.html">Log in</a></p></section></main><script src="/js/api.js"></script><script>registerForm.onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);await api('/api/auth/register',{method:'POST',body:JSON.stringify(Object.fromEntries(f))},false);location='/login.html'}catch(x){error.textContent=x.message}}</script></body></html>
