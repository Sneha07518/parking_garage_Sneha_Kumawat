<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | ParkSmart</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="auth"><a class="brand" href="/">Park<span>Smart</span></a><section class="auth-box"><p class="eyebrow">ATTENDANT ACCESS</p><h1>Welcome back.</h1><form id="loginForm"><label>Email<input type="email" name="email" value="admin@parksmart.com" required></label><label>Password<input type="password" name="password" value="admin123" required></label><button class="button" type="submit">Log in</button><p class="form-error" id="error"></p></form><p class="muted">New here? <a href="/register.html">Create an account</a></p></section></main><script src="/js/api.js"></script><script>loginForm.onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))},false);localStorage.setItem('parksmart_token',r.token);location='/dashboard.html'}catch(x){error.textContent=x.message}}</script></body></html>
